<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)" rx="16" />

  <!-- Grid Pattern Background -->
  <g opacity="0.08">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250" stroke="#ffffff" stroke-width="1" />
    <path d="M 100,0 L 100,300 M 200,0 L 200,300 M 300,0 L 300,300 M 400,0 L 400,300 M 500,0 L 500,300 M 600,0 L 600,300 M 700,0 L 700,300 M 800,0 L 800,300 M 900,0 L 900,300 M 1000,0 L 1000,300 M 1100,0 L 1100,300" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Dynamic Animated Background Orbs -->
  <g filter="url(#glow)" opacity="0.35">
    <circle cx="150" cy="80" r="100" fill="url(#accentCyan)">
      <animate attributeName="cx" values="150;220;150" dur="8s" repeatCount="indefinite" />
      <animate attributeName="cy" values="80;120;80" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="220" r="120" fill="url(#accentPurple)">
      <animate attributeName="cx" values="1050;970;1050" dur="10s" repeatCount="indefinite" />
      <animate attributeName="cy" values="220;170;220" dur="7s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Dynamic Glowing Network Lines -->
  <g stroke="url(#accentCyan)" stroke-width="1.5" opacity="0.4">
    <line x1="50" y1="250" x2="250" y2="180">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="250" y1="180" x2="400" y2="240">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="5s" repeatCount="indefinite" />
    </line>
    <line x1="800" y1="60" x2="980" y2="120">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4.5s" repeatCount="indefinite" />
    </line>
    <line x1="980" y1="120" x2="1150" y2="70">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.5s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Nodes with pulsing ring effect -->
  <g>
    <circle cx="250" cy="180" r="5" fill="#38bdf8" />
    <circle cx="250" cy="180" r="12" fill="none" stroke="#38bdf8" stroke-width="1">
      <animate attributeName="r" values="5;18;5" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;1" dur="3s" repeatCount="indefinite" />
    </circle>

    <circle cx="980" cy="120" r="5" fill="#c084fc" />
    <circle cx="980" cy="120" r="12" fill="none" stroke="#c084fc" stroke-width="1">
      <animate attributeName="r" values="5;18;5" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;1" dur="3.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Foreground Main Content Layer -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Shield / Governance Icon -->
    <g transform="translate(600, 55)">
      <path d="M 0 -22 L 20 -12 L 20 8 C 20 20 0 28 0 28 C 0 28 -20 20 -20 8 L -20 -12 Z" fill="none" stroke="url(#textGrad)" stroke-width="3.5" filter="url(#glow)">
        <animate attributeName="stroke-width" values="3.5;5;3.5" dur="3s" repeatCount="indefinite" />
      </path>
      <path d="M -6 2 L -1 7 L 8 -4" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Main Title -->
    <text x="600" y="145" font-size="40" font-weight="800" fill="url(#textGrad)" letter-spacing="0.5">
      Awesome AI Governance Platform
    </text>

    <!-- Subtitle -->
    <text x="600" y="185" font-size="17" font-weight="500" fill="#e2e8f0" opacity="0.95" letter-spacing="0.3">
      🛡️ Comprehensive Directory of Commercial SaaS &amp; Open-Source AI Risk, Policy &amp; Compliance Platforms
    </text>

    <!-- Feature Pills -->
    <g transform="translate(600, 235)">
      <!-- Pill 1 -->
      <g transform="translate(-240, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9"/>
        <text x="0" y="5" font-size="12" font-weight="600" fill="#38bdf8">⚖️ EU AI Act &amp; NIST RMF</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(0, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.9"/>
        <text x="0" y="5" font-size="12" font-weight="600" fill="#818cf8">📊 Model Inventory &amp; GRC</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(240, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" opacity="0.9"/>
        <text x="0" y="5" font-size="12" font-weight="600" fill="#c084fc">🔒 Guardrails &amp; Ethics</text>
      </g>
    </g>
  </g>
</svg>
